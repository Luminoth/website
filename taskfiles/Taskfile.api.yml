version: "3"

tasks:
  run:
    desc: Start the API locally via cargo
    cmds:
      - cargo run --bin energonsoftware

  run-docker:
    desc: Build and run the API in Docker
    deps: [build-image]
    cmds:
      - docker run --rm -it -p 8000:8000 energonsoftware-api

  build:
    desc: Build the API locally (cargo build)
    cmds:
      - cargo build

  build-image:
    desc: Build the API Docker image
    silent: true
    cmds:
      - docker buildx build -t energonsoftware-api -f api/Dockerfile .

  check:
    desc: Fast compile check (cargo check)
    cmds:
      - cargo check

  lint:
    desc: Run Rust linter (cargo clippy)
    cmds:
      - cargo clippy

  fmt:
    desc: Format Rust source code (cargo fmt)
    cmds:
      - cargo fmt

  fmt-check:
    desc: Check Rust formatting without modifying files
    cmds:
      - cargo fmt --check

  test:
    desc: Run Rust unit tests
    cmds:
      - cargo test

  update:
    desc: Update Rust dependencies (cargo update)
    cmds:
      - cargo update

  deploy:
    desc: Build and push to ECR tagged with the current git SHA
    requires:
      vars: [AWS_ACCOUNT]
    vars:
      IMAGE_TAG:
        sh: git rev-parse --short HEAD
      AWS_REGION: '{{.AWS_REGION | default "us-west-2"}}'
    cmds:
      - |
        if [ -n "$(git status --porcelain)" ]; then
          echo "Refusing to deploy: working tree has uncommitted changes (the image tag is derived from the git SHA, so it wouldn't reflect what's actually built). Commit or stash first." >&2
          exit 1
        fi
      - task: build-image
      - aws ecr get-login-password --region {{.AWS_REGION}} | docker login --username AWS --password-stdin $AWS_ACCOUNT.dkr.ecr.{{.AWS_REGION}}.amazonaws.com
      - docker tag energonsoftware-api:latest $AWS_ACCOUNT.dkr.ecr.{{.AWS_REGION}}.amazonaws.com/energonsoftware-api:{{.IMAGE_TAG}}
      - docker push $AWS_ACCOUNT.dkr.ecr.{{.AWS_REGION}}.amazonaws.com/energonsoftware-api:{{.IMAGE_TAG}}
      - |
        echo ""
        echo "Pushed energonsoftware-api:{{.IMAGE_TAG}}. Now, in the infrastructure repo:"
        echo ""
        echo "  1. Set image_tag = \"{{.IMAGE_TAG}}\" on module \"energonsoftware_api\" in envs/prod/main.tf"
        echo "  2. git commit -am 'Deploy energonsoftware-api {{.IMAGE_TAG}}'"
        echo "  3. task prod:plan   # preview"
        echo "  4. task prod:apply"
        echo ""
