[package]
name = "api"
version = "0.1.1"
authors = ["Shane Lillie <ignignokterr@gmail.com>"]
edition = "2024"

[[bin]]
name = "energonsoftware"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aws-config = "1.8"
axum = { version = "0.8", features = ["macros"] }
clap = { version = "4.6", features = ["derive"] }
console-subscriber = "0.5"
dotenvy = "0.15"
dynamodb_expression = { git = "https://github.com/Luminoth/dynamodb_expression" }
http = "1.4"
opentelemetry = "0.32"
opentelemetry-appender-tracing = { version = "0.32", features = [
    "experimental_span_attributes",
] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
opentelemetry_sdk = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# tracing requires tokio_unstable in .cargo/config.toml
tokio = { version = "1.52", features = ["full", "tracing"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"

[dependencies.energonsoftware]
version = "*"
path = "../core"
